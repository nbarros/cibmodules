syntax = "proto3";

package dunedaq.cibmodules.opmon;

// this has to match the CIBModuleInfo in CIBModule.hpp
message CIBModuleInfo 
{

  // board comunication
  uint32 num_control_messages_sent = 1;  // Number of control messages sent to CIB
  uint32 num_control_responses_received = 2;  // Number of control message responses received from CIB

  // board status
  bool hardware_running = 5;  
  bool hardware_configured = 6;

  uint64 num_triggers_received = 10;  // Total trigger count for a run.
  uint64 last_readout_timestamp = 11;  // Timestamp of the last readout word

  // HSI interface
  uint64 sent_hsi_events_counter = 15; // Number of HSI events sent so far
  uint64 failed_to_send_hsi_events_counter = 16; // Number of failed send attempts so far

  // // timestamps
  // uint64 last_sent_timestamp = 17;  // Timestamp of the last sent HSIEvent

  // CIB related properties
  double average_buffer_occupancy = 21;  // Average (word) occupancy of buffer in CIB firmware.

 
} 

